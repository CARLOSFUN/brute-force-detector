<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brute Force Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }

    .navbar { background: #161b22; border-bottom: 1px solid #30363d; }
    .navbar-brand { color: #58a6ff !important; font-weight: 700; font-size: 1.3rem; letter-spacing: 1px; }
    .badge-live { background: #238636; color: #fff; font-size: 0.65rem; padding: 3px 7px; border-radius: 20px; vertical-align: middle; }

    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; }
    .card-title { color: #8b949e; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; }
    .card-value { font-size: 2rem; font-weight: 700; color: #c9d1d9; }
    .card-value.red { color: #f85149; }
    .card-value.yellow { color: #e3b341; }
    .card-value.blue { color: #58a6ff; }

    .day-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 6px 16px; cursor: pointer; transition: all 0.15s; }
    .day-btn:hover { background: #30363d; }
    .day-btn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }

    .scan-btn { background: #238636; border: none; color: #fff; padding: 8px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .scan-btn:hover { background: #2ea043; }
    .scan-btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

    .table { color: #c9d1d9; }
    .table thead th { background: #21262d; color: #8b949e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border-color: #30363d; }
    .table tbody tr { border-color: #21262d; }
    .table tbody tr:hover { background: #1c2128; }
    td { border-color: #21262d !important; vertical-align: middle; font-size: 0.85rem; }

    .badge-score-red    { background: #f851491a; color: #f85149; border: 1px solid #f85149; padding: 3px 8px; border-radius: 20px; font-size: 0.75rem; }
    .badge-score-yellow { background: #e3b3411a; color: #e3b341; border: 1px solid #e3b341; padding: 3px 8px; border-radius: 20px; font-size: 0.75rem; }
    .badge-score-green  { background: #2386361a; color: #3fb950; border: 1px solid #3fb950; padding: 3px 8px; border-radius: 20px; font-size: 0.75rem; }

    .status-malicious { background: #f851491a; color: #f85149; border: 1px solid #f85149; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-reported  { background: #e3b3411a; color: #e3b341; border: 1px solid #e3b341; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-clean     { background: #2386361a; color: #3fb950; border: 1px solid #3fb950; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

    .mitre-badge { background: #6e40c91a; color: #bc8cff; border: 1px solid #6e40c9; padding: 2px 7px; border-radius: 4px; font-size: 0.72rem; font-family: monospace; text-decoration: none; }
    .mitre-badge:hover { background: #6e40c933; color: #d2a8ff; }

    .spinner-border { width: 1.2rem; height: 1.2rem; border-width: 2px; }
    .scan-time { color: #8b949e; font-size: 0.82rem; }
    .empty-state { color: #8b949e; padding: 40px 0; text-align: center; font-size: 0.95rem; }
    .ip-mono { font-family: monospace; font-size: 0.85rem; color: #79c0ff; }
    .account-text { font-size: 0.78rem; color: #8b949e; max-width: 180px; word-break: break-all; }
    .section-label { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .chart-container { position: relative; height: 220px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar px-4 py-3 mb-4">
  <span class="navbar-brand">&#x1F6E1; Brute Force Detector</span>
  <span class="badge-live">&#x25CF; LIVE</span>
</nav>

<div class="container-fluid px-4">

  <!-- Controls -->
  <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
    <div>
      <div class="section-label mb-2">Lookback Period</div>
      <div class="d-flex gap-2" id="dayToggle">
        <button class="day-btn active" data-days="1">1 Day</button>
        <button class="day-btn" data-days="3">3 Days</button>
        <button class="day-btn" data-days="7">7 Days</button>
        <button class="day-btn" data-days="14">14 Days</button>
        <button class="day-btn" data-days="30">30 Days</button>
      </div>
    </div>
    <div class="ms-3 mt-3">
      <button class="scan-btn" id="scanBtn" onclick="runScan()">
        <span id="scanBtnText">&#9654; Run Scan</span>
        <span id="scanSpinner" class="spinner-border ms-2 d-none" role="status"></span>
      </button>
    </div>
    <div class="mt-3 scan-time" id="scanTime"></div>
  </div>

  <!-- Summary Cards -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="card p-3">
        <div class="card-title">Total Failed Logins</div>
        <div class="card-value blue" id="totalEvents">--</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-3">
        <div class="card-title">Flagged IPs</div>
        <div class="card-value yellow" id="flaggedCount">--</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-3">
        <div class="card-title">Known Malicious</div>
        <div class="card-value red" id="maliciousCount">--</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-3">
        <div class="card-title">Top Attacker IP</div>
        <div class="card-value" id="topIp" style="font-size:1rem; padding-top:0.6rem; font-family:monospace; color:#79c0ff;">--</div>
      </div>
    </div>
  </div>

  <!-- Attack Timeline Chart -->
  <div class="card p-3 mb-4" id="chartCard" style="display:none;">
    <div class="section-label mb-3">Failed Login Activity</div>
    <div class="chart-container">
      <canvas id="attackChart"></canvas>
    </div>
  </div>

  <!-- Results Table -->
  <div class="card p-3">
    <div class="section-label mb-3">Flagged IPs</div>
    <div class="table-responsive">
      <table class="table table-borderless mb-0">
        <thead>
          <tr>
            <th>IP Address</th>
            <th>Failures</th>
            <th>Window Start</th>
            <th>Targeted Account</th>
            <th>Target VM</th>
            <th>Country</th>
            <th>ISP</th>
            <th>Abuse Score</th>
            <th>MITRE</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr>
            <td colspan="10" class="empty-state">Run a scan to see results.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- /container -->

<script>
  let selectedDays = 1;
  let attackChart = null;

  // Day toggle
  document.getElementById("dayToggle").addEventListener("click", function(e) {
    const btn = e.target.closest(".day-btn");
    if (!btn) return;
    document.querySelectorAll(".day-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedDays = parseInt(btn.dataset.days);
  });

  function renderChart(labels, values) {
    const card = document.getElementById("chartCard");
    card.style.display = "block";

    if (attackChart) attackChart.destroy();

    const ctx = document.getElementById("attackChart").getContext("2d");
    attackChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [{
          label: "Failed Logins",
          data: values,
          backgroundColor: "rgba(31, 111, 235, 0.5)",
          borderColor: "#388bfd",
          borderWidth: 1,
          borderRadius: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "#161b22",
            borderColor: "#30363d",
            borderWidth: 1,
            titleColor: "#c9d1d9",
            bodyColor: "#8b949e",
          }
        },
        scales: {
          x: {
            ticks: { color: "#8b949e", font: { size: 10 }, maxRotation: 45 },
            grid: { color: "#21262d" }
          },
          y: {
            ticks: { color: "#8b949e", font: { size: 11 } },
            grid: { color: "#21262d" },
            beginAtZero: true
          }
        }
      }
    });
  }

  async function runScan() {
    const scanBtn = document.getElementById("scanBtn");
    const scanBtnText = document.getElementById("scanBtnText");
    const scanSpinner = document.getElementById("scanSpinner");

    scanBtn.disabled = true;
    scanBtnText.textContent = "Scanning...";
    scanSpinner.classList.remove("d-none");
    document.getElementById("resultsBody").innerHTML = `<tr><td colspan="10" class="empty-state">Fetching live data from Azure...</td></tr>`;

    try {
      const res = await fetch("/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ days: selectedDays })
      });

      const data = await res.json();

      if (data.error) {
        document.getElementById("resultsBody").innerHTML = `<tr><td colspan="10" class="empty-state text-danger">Error: ${data.error}</td></tr>`;
        return;
      }

      // Update summary cards
      document.getElementById("totalEvents").textContent = data.total_events.toLocaleString();
      document.getElementById("flaggedCount").textContent = data.flagged_count;
      document.getElementById("maliciousCount").textContent = data.malicious_count;
      document.getElementById("topIp").textContent = data.top_ip;
      document.getElementById("scanTime").textContent = "Last scanned: " + data.scan_time + " (" + selectedDays + (selectedDays === 1 ? " day" : " days") + ")";

      // Render attack timeline chart
      if (data.chart_labels && data.chart_labels.length > 0) {
        renderChart(data.chart_labels, data.chart_values);
      }

      // Build table rows
      if (!data.flagged_ips || data.flagged_ips.length === 0) {
        document.getElementById("resultsBody").innerHTML = `<tr><td colspan="10" class="empty-state">No brute force activity detected in this period.</td></tr>`;
        return;
      }

      const mitreUrls = {
        "T1110.001": "https://attack.mitre.org/techniques/T1110/001/",
        "T1110.003": "https://attack.mitre.org/techniques/T1110/003/",
        "T1110.004": "https://attack.mitre.org/techniques/T1110/004/",
      };

      const rows = data.flagged_ips.map(ip => {
        const score = ip.AbuseConfidenceScore;
        let scoreBadge, statusBadge;

        if (score >= 25) {
          scoreBadge = `<span class="badge-score-red">${score}%</span>`;
          statusBadge = `<span class="status-malicious">Malicious</span>`;
        } else if (score > 0) {
          scoreBadge = `<span class="badge-score-yellow">${score}%</span>`;
          statusBadge = `<span class="status-reported">Reported</span>`;
        } else if (score === -1) {
          scoreBadge = `<span class="badge-score-green">N/A</span>`;
          statusBadge = `<span class="status-clean">Unknown</span>`;
        } else {
          scoreBadge = `<span class="badge-score-green">${score}%</span>`;
          statusBadge = `<span class="status-clean">Clean</span>`;
        }

        const windowStart = ip.WindowStart ? ip.WindowStart.replace("T", " ").split(".")[0] : "N/A";
        const account = ip.TargetedAccounts || "N/A";
        const targetVMs = ip.TargetedVMs || "Unknown";
        const country = ip.Country || "N/A";
        const mitreID = ip.MitreID || "";
        const mitreName = ip.MitreTechnique || "";
        const mitreUrl = mitreUrls[mitreID] || "#";
        const mitreBadge = mitreID
          ? `<a href="${mitreUrl}" target="_blank" class="mitre-badge" title="${mitreName}">${mitreID}</a><br><small style="color:#8b949e;font-size:0.7rem;">${mitreName}</small>`
          : "N/A";

        return `<tr>
          <td><span class="ip-mono">${ip.IPAddress}</span></td>
          <td><strong>${ip.FailureCount}</strong> <small class="text-muted">in ${ip.WindowMinutes}m</small></td>
          <td><small>${windowStart}</small></td>
          <td><div class="account-text">${account}</div></td>
          <td><small>${targetVMs}</small></td>
          <td><small>${country}</small></td>
          <td><small>${ip.ISP || "N/A"}</small></td>
          <td>${scoreBadge}</td>
          <td>${mitreBadge}</td>
          <td>${statusBadge}</td>
        </tr>`;
      }).join("");

      document.getElementById("resultsBody").innerHTML = rows;

    } catch (err) {
      document.getElementById("resultsBody").innerHTML = `<tr><td colspan="10" class="empty-state text-danger">Failed to connect to server: ${err.message}</td></tr>`;
    } finally {
      scanBtn.disabled = false;
      scanBtnText.textContent = "▶ Run Scan";
      scanSpinner.classList.add("d-none");
    }
  }
</script>

</body>
</html>
